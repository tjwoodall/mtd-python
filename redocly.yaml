extends:
  - recommended

plugins:
  - redocly.id-and-schema.js

rules:
  struct: warn
  operation-operationId: off
  info-license: off
  no-unused-components: off
  operation-4xx-response: off
  tag-description: off

openapi:
  theme:
    typography:
      fontFamily: "DejaVu Sans, sans-serif"
      headings:
        fontFamily: "DejaVu Sans, sans-serif"
      code:
        fontFamily: "DejaVu Sans Mono, monospace"
